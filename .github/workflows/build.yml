name: build-windows
on:
  workflow_dispatch:
  push:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --project-name zajil_admin .
      - name: Build
        run: |
          flutter pub get
          flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: ZajilAdmin-Windows
          path: build/windows/x64/runner/Release
